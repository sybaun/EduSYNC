version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: edusync-db
    environment:
      POSTGRES_USER: edusync
      POSTGRES_PASSWORD: edusync_password
      POSTGRES_DB: edusync_db
    ports:
      - "5432:5432"
    volumes:
      - edusync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusync -d edusync_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  node_modules:
  edusync_postgres_data:
      DATABASE_URL: postgresql://edusync:edusync_password@db:5432/edusync_db
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edusync-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    container_name: edusync-frontend-web
    build:
      context: ./src
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - edusync-network

volumes:
  edusync_postgres_data:

networks:
  edusync-network:
    driver: bridge
